<style>
#almFlota {
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: #1e293b;
    padding: 0.75rem 1.25rem 3rem 1.25rem;
    min-height: calc(100vh - 60px);
}
#almFlota .alm-head { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: flex-end; justify-content: space-between; margin-bottom: 1rem; }
#almFlota .alm-eyebrow { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #0f766e; }
#almFlota .alm-title { font-size: 1.5rem; font-weight: 800; margin: 0; }
#almFlota .alm-sub { color: #64748b; font-size: 0.9rem; margin: 0; }
#almFlota .alm-acciones { display: flex; flex-wrap: wrap; gap: 0.5rem; }
#almFlota .alm-metricas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.75rem; margin-bottom: 1rem; }
#almFlota .alm-metrica { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 0.75rem 1rem; }
#almFlota .alm-metrica b { display: block; font-size: 1.25rem; font-weight: 800; }
#almFlota .alm-metrica span { font-size: 0.78rem; color: #64748b; }
#almFlota .alm-card {
    display: block; width: 100%; text-align: left; background: #fff;
    border: 1px solid #e2e8f0; border-radius: 14px; padding: 0.9rem 1rem;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}
#almFlota .alm-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px -3px rgba(15, 23, 42, 0.08); }
#almFlota .alm-card-titulo { font-weight: 700; font-size: 0.98rem; }
#almFlota .alm-card-sub { font-size: 0.8rem; color: #64748b; }
#almFlota .alm-cifras { display: flex; gap: 1.25rem; margin-top: 0.5rem; font-size: 0.78rem; color: #475569; }
#almFlota .alm-cifras b { display: block; font-size: 1rem; color: #0f172a; }
#almFlota .alm-placas { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.5rem; }
#almFlota .alm-placa { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 0.78rem; letter-spacing: 0.04em; background: #fff; border: 2px solid #0f172a; border-radius: 6px; padding: 1px 6px; }
#almFlota .alm-chip-cant { font-size: 0.75rem; color: #475569; align-self: center; }
#almFlota .alm-vacio { color: #64748b; text-align: center; padding: 3rem 0; }
#almFlota .alm-entrada { color: #15803d; font-weight: 700; }
#almFlota .alm-salida { color: #b45309; font-weight: 700; }
@media (max-width: 575px) {
    #almFlota { padding: 0.75rem 0.75rem 3rem; }
    #almFlota .alm-metricas { grid-template-columns: 1fr 1fr; }
    #almFlota .alm-metrica:last-child { grid-column: 1 / -1; }
}
</style>

<div id="almFlota">
    <div class="alm-head">
        <div>
            <div class="alm-eyebrow">Flota</div>
            <h1 class="alm-title">Almacén de flota</h1>
            <p class="alm-sub" id="almFlotaSub">Cargando…</p>
        </div>
        <div class="alm-acciones" id="almFlotaAcciones" hidden>
            <button type="button" class="btn btn-outline-dark rounded-pill px-3 fw-semibold btn-sm" id="btnAlmFlotaNuevo"><i class="bi bi-plus-lg me-1"></i>Nuevo artículo</button>
            <button type="button" class="btn btn-outline-dark rounded-pill px-3 fw-semibold btn-sm" id="btnAlmFlotaIngresar"><i class="bi bi-box-arrow-in-down me-1"></i>Ingresar</button>
            <button type="button" class="btn btn-dark rounded-pill px-3 fw-semibold btn-sm" id="btnAlmFlotaAsignar"><i class="bi bi-box-arrow-up me-1"></i>Asignar a unidad</button>
        </div>
    </div>

    <div class="alm-metricas">
        <div class="alm-metrica"><b id="almFlotaMetAlmacen">0</b><span>En almacén</span></div>
        <div class="alm-metrica"><b id="almFlotaMetUnidades">0</b><span>En unidades</span></div>
        <div class="alm-metrica"><b id="almFlotaMetValor">S/ 0.00</b><span>Valor total</span></div>
    </div>

    <ul class="nav nav-pills mb-3" id="almFlotaTabs">
        <li class="nav-item"><button type="button" class="nav-link active" data-vista="articulos">Artículos</button></li>
        <li class="nav-item"><button type="button" class="nav-link" data-vista="unidades">Unidades</button></li>
        <li class="nav-item"><button type="button" class="nav-link" data-vista="historial">Historial</button></li>
    </ul>

    <div class="row g-2 mb-3" id="almFlotaFiltros">
        <div class="col-md-6">
            <input type="search" class="form-control" id="almFlotaBuscar" placeholder="Artículo o placa…">
        </div>
    </div>

    <div class="row g-2 mb-3" id="almFlotaHistFiltros" hidden>
        <div class="col-6 col-md-2"><input type="date" class="form-control form-control-sm" id="almHistDesde" aria-label="Desde"></div>
        <div class="col-6 col-md-2"><input type="date" class="form-control form-control-sm" id="almHistHasta" aria-label="Hasta"></div>
        <div class="col-6 col-md-2">
            <select class="form-select form-select-sm" id="almHistTipo" aria-label="Tipo">
                <option value="">Todas</option>
                <option value="INGRESO">Ingresos</option>
                <option value="ASIGNACION">Salidas a unidad</option>
                <option value="REINGRESO">Reingresos</option>
            </select>
        </div>
        <div class="col-6 col-md-3"><input type="text" class="form-control form-control-sm" id="almHistPlaca" placeholder="Placa" aria-label="Placa"></div>
        <div class="col-12 col-md-3"><input type="text" class="form-control form-control-sm" id="almHistArticulo" placeholder="Artículo" aria-label="Artículo"></div>
    </div>

    <div class="row g-3" id="almFlotaContenido"></div>
</div>

<!-- Detalle de un artículo o de una unidad -->
<div class="modal fade" id="modalAlmFlotaDetalle" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="almFlotaDetTitulo">Detalle</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body" id="almFlotaDetCuerpo"></div>
            <div class="modal-footer" id="almFlotaDetPie">
                <button type="button" class="btn btn-outline-dark rounded-pill px-3 btn-sm" id="btnAlmFlotaDetEditar" hidden>Editar artículo</button>
                <button type="button" class="btn btn-outline-dark rounded-pill px-3 btn-sm" id="btnAlmFlotaDetReingresar" hidden>Reingresar al almacén</button>
                <button type="button" class="btn btn-dark rounded-pill px-3 btn-sm" id="btnAlmFlotaDetAsignar" hidden>Asignar más</button>
            </div>
        </div>
    </div>
</div>

<!-- Crear o editar artículo -->
<div class="modal fade" id="modalAlmFlotaArticulo" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="almFlotaArtTitulo">Nuevo artículo</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label fw-semibold small" for="almArtDescripcion">Descripción</label>
                    <input type="text" class="form-control" id="almArtDescripcion" placeholder="Ej. Trinca de 3/8">
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-6"><label class="form-label fw-semibold small" for="almArtFamilia">Familia</label><input type="text" class="form-control" id="almArtFamilia" placeholder="Ej. Herramientas"></div>
                    <div class="col-6"><label class="form-label fw-semibold small" for="almArtUnidad">Unidad</label><input type="text" class="form-control" id="almArtUnidad" placeholder="UND, LT, KG"></div>
                    <div class="col-6"><label class="form-label fw-semibold small" for="almArtCosto">Costo referencial (S/)</label><input type="number" step="0.01" min="0" class="form-control" id="almArtCosto" placeholder="0.00"></div>
                    <div class="col-6"><label class="form-label fw-semibold small" for="almArtMinimo">Stock mínimo</label><input type="number" step="any" min="0" class="form-control" id="almArtMinimo" placeholder="0"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light rounded-pill px-3" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-dark rounded-pill px-4 fw-semibold" id="btnAlmArtGuardar">Guardar</button>
            </div>
        </div>
    </div>
</div>

<!-- Ingreso, asignación o reingreso -->
<div class="modal fade" id="modalAlmFlotaMov" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="almFlotaMovTitulo">Movimiento</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <div class="row g-3 mb-3">
                    <div class="col-md-5" id="almFlotaMovUnidadWrap">
                        <label class="form-label fw-semibold small" for="almMovPlaca" id="almMovPlacaLbl">Unidad</label>
                        <select class="form-select" id="almMovPlaca"></select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold small" for="almMovFecha">Fecha</label>
                        <input type="date" class="form-control" id="almMovFecha">
                    </div>
                    <div class="col-md-4" id="almFlotaMovRefWrap">
                        <label class="form-label fw-semibold small" for="almMovRef">Guía, factura o proveedor</label>
                        <input type="text" class="form-control" id="almMovRef" placeholder="Opcional">
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold small" for="almMovObs">Observaciones</label>
                        <input type="text" class="form-control" id="almMovObs" placeholder="Opcional">
                    </div>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="fw-semibold small" id="almMovLineasTitulo">Artículos</span>
                    <button type="button" class="btn btn-outline-dark btn-sm rounded-pill px-3" id="btnAlmMovAgregar"><i class="bi bi-plus-lg me-1"></i>Agregar artículo</button>
                </div>
                <div id="almMovLineas"></div>
                <p class="small text-muted mb-0" id="almMovAyuda"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light rounded-pill px-3" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-dark rounded-pill px-4 fw-semibold" id="btnAlmMovGuardar">Guardar</button>
            </div>
        </div>
    </div>
</div>
