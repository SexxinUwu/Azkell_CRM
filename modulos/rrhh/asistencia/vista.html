<!-- ════════════════════════════════════════════════════════════════════════════
     MÓDULO: RRHH — TAREO & ASISTENCIA DIARIA (MATRIZ INTERACTIVA)
     ERP Azkell
     ════════════════════════════════════════════════════════════════════════════ -->

<style>
.tareo-cell {
    width: 32px;
    height: 32px;
    padding: 0;
    text-align: center;
    font-weight: 800;
    font-size: 0.72rem;
    cursor: pointer;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
    user-select: none;
}
.tareo-cell:hover {
    transform: scale(1.15);
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    z-index: 2;
}

/* Estados de Tareo */
.st-A { background: #dcfce7; color: #15803d; border: 1px solid #86efac; } /* Asistió */
.st-T { background: #fef9c3; color: #a16207; border: 1px solid #fde047; } /* Tardanza */
.st-F { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; } /* Falta */
.st-R { background: #dbeafe; color: #1d4ed8; border: 1px solid #93c5fd; } /* En Ruta (Viaje) */
.st-DM { background: #f3e8ff; color: #7e22ce; border: 1px solid #d8b4fe; } /* Descanso Médico */
.st-V { background: #e0f2fe; color: #0369a1; border: 1px solid #7dd3fc; } /* Vacaciones */
.st-P { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; } /* Permiso */
.st-D { background: #f8fafc; color: #94a3b8; border: 1px solid #e2e8f0; } /* Descanso */
.st-FER { background: #ffedd5; color: #c2410c; border: 1px solid #fdba74; } /* Feriado */
.st-EMPTY { background: #ffffff; color: #cbd5e1; border: 1px dashed #cbd5e1; }

.tareo-sticky-col {
    position: sticky;
    left: 0;
    background: #ffffff;
    z-index: 5;
    box-shadow: 2px 0 6px rgba(0,0,0,0.04);
}
.table thead th.tareo-sticky-col {
    background: #f8fafc;
    z-index: 6;
}
</style>

<div class="container-fluid p-3 p-md-4">

    <!-- Header Principal -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4">
        <div>
            <div class="d-flex align-items-center gap-2">
                <div class="p-2 rounded-3 bg-success bg-opacity-10 text-success">
                    <i class="bi bi-calendar-check-fill fs-4"></i>
                </div>
                <div>
                    <h4 class="fw-bold text-dark m-0">Tareo & Control de Asistencia Diaria</h4>
                    <p class="text-muted small m-0">Matriz mensual interactiva de asistencia, descansos, rutas y permisos</p>
                </div>
            </div>
        </div>
        <div class="d-flex flex-wrap align-items-center gap-2">
            <button type="button" class="btn btn-outline-primary rounded-pill px-3 fw-bold" onclick="window.rrhhTareoSincronizarViajes()">
                <i class="bi bi-truck me-1"></i> Sincronizar Viajes Activos
            </button>
            <button type="button" class="btn btn-outline-success rounded-pill px-3 fw-bold" onclick="window.rrhhTareoAutocompletarHoy()">
                <i class="bi bi-check-all me-1"></i> Marcar Asistencia de Hoy
            </button>
            <button type="button" class="btn btn-primary rounded-pill px-3.5 fw-bold shadow-sm" onclick="window.rrhhTareoAbrirModalLicencia()">
                <i class="bi bi-plus-circle-fill me-1"></i> Registrar Vacación / Permiso
            </button>
        </div>
    </div>

    <!-- Barra de Selección de Periodo y Filtros -->
    <div class="card border-0 shadow-sm rounded-4 p-3 mb-4 bg-white">
        <div class="row g-2 align-items-center">
            <div class="col-6 col-md-2">
                <label class="form-label small fw-bold text-muted mb-1">AÑO</label>
                <select class="form-select form-select-sm rounded-pill font-monospace fw-bold" id="tareo-filtro-anio" onchange="window.rrhhTareoCargarMatriz()">
                    <option value="2026" selected>2026</option>
                    <option value="2025">2025</option>
                    <option value="2027">2027</option>
                </select>
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label small fw-bold text-muted mb-1">MES</label>
                <select class="form-select form-select-sm rounded-pill fw-bold" id="tareo-filtro-mes" onchange="window.rrhhTareoCargarMatriz()">
                    <option value="1">Enero</option>
                    <option value="2">Febrero</option>
                    <option value="3">Marzo</option>
                    <option value="4">Abril</option>
                    <option value="5">Mayo</option>
                    <option value="6">Junio</option>
                    <option value="7">Julio</option>
                    <option value="8">Agosto</option>
                    <option value="9" selected>Septiembre</option>
                    <option value="10">Octubre</option>
                    <option value="11">Noviembre</option>
                    <option value="12">Diciembre</option>
                </select>
            </div>
            <div class="col-12 col-md-3">
                <label class="form-label small fw-bold text-muted mb-1">ÁREA / ROL</label>
                <select class="form-select form-select-sm rounded-pill" id="tareo-filtro-rol" onchange="window.rrhhTareoCargarMatriz()">
                    <option value="TODOS" selected>Todos los Colaboradores</option>
                    <option value="CONDUCTOR">🚛 Solo Conductores</option>
                    <option value="MECANICO_TALLER">🔧 Solo Mecánicos / Taller</option>
                    <option value="ADMINISTRATIVO">🏢 Solo Administrativos</option>
                    <option value="LIMPIEZA_SERVICIOS">🧹 Solo Limpieza / Base</option>
                </select>
            </div>
            <div class="col-12 col-md-4 text-md-end">
                <label class="form-label small fw-bold text-muted mb-1 d-block">LEYENDA RÁPIDA</label>
                <div class="d-flex flex-wrap gap-1 justify-content-md-end">
                    <span class="badge st-A" title="Asistió">A: Asistió</span>
                    <span class="badge st-T" title="Tardanza">T: Tardanza</span>
                    <span class="badge st-F" title="Falta">F: Falta</span>
                    <span class="badge st-R" title="En Ruta">R: En Ruta</span>
                    <span class="badge st-DM" title="Descanso Médico">DM: Descanso Méd.</span>
                    <span class="badge st-V" title="Vacaciones">V: Vacaciones</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Matriz Visual de Tareo -->
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
        <div class="table-responsive custom-scrollbar" style="max-height: 70vh;">
            <table class="table table-bordered table-hover align-middle mb-0 text-center" style="font-size:0.8rem;" id="tabla-tareo">
                <thead class="bg-light text-muted fw-bold" id="tabla-tareo-thead">
                    <!-- Columnas de días generadas dinámicamente -->
                </thead>
                <tbody id="tabla-tareo-tbody">
                    <tr>
                        <td colspan="35" class="text-center py-5 text-muted">
                            <span class="spinner-border spinner-border-sm me-2 text-primary"></span> Generando matriz de asistencia...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- ════════════════════════════════════════════════════════════════════════════
     MODAL REGISTRAR LICENCIA / VACACIONES / DESCANSO MÉDICO
     ════════════════════════════════════════════════════════════════════════════ -->
<div class="modal fade" id="modalLicenciaForm" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header border-bottom bg-light px-4 py-3">
                <h5 class="modal-title fw-bold text-dark m-0">Registrar Vacación / Permiso / Descanso Médico</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <form id="formLicencia" onsubmit="window.rrhhTareoGuardarLicencia(event)">
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Colaborador *</label>
                        <select class="form-select form-select-sm" id="lic-personal-id" required>
                            <!-- Opciones cargadas dinámicamente -->
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Tipo de Solicitud *</label>
                        <select class="form-select form-select-sm fw-bold" id="lic-tipo" required>
                            <option value="VACACIONES">🏖️ VACACIONES</option>
                            <option value="DESCANSO_MEDICO">🏥 DESCANSO MÉDICO (ESSALUD/CLÍNICA)</option>
                            <option value="PERMISO_CON_GOCE">📝 PERMISO CON GOCE DE HABER</option>
                            <option value="PERMISO_SIN_GOCE">📄 PERMISO SIN GOCE DE HABER</option>
                            <option value="LICENCIA_PATERNIDAD">👶 LICENCIA POR PATERNIDAD</option>
                        </select>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label small fw-bold">Fecha Inicio *</label>
                            <input type="date" class="form-control form-control-sm" id="lic-fecha-ini" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label small fw-bold">Fecha Fin *</label>
                            <input type="date" class="form-control form-control-sm" id="lic-fecha-fin" required>
                        </div>
                    </div>
                    <div class="mb-0">
                        <label class="form-label small fw-bold">Motivo / Detalle</label>
                        <textarea class="form-control form-control-sm" id="lic-motivo" rows="2" placeholder="Detalle o diagnóstico (opcional)..."></textarea>
                    </div>
                </div>
                <div class="modal-footer bg-light px-4 py-3 border-top d-flex justify-content-between">
                    <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm" id="lic-btn-guardar">
                        <i class="bi bi-check-circle-fill me-1"></i> Guardar y Aplicar a Tareo
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
