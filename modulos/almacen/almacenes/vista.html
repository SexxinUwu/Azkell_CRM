<!-- Módulo Almacén / Configuración de Almacenes — SPA Aislado -->
<div id="mod-almacenes-config" class="modulo-wrapper d-flex flex-column h-100">

  <!-- Cabecera Oficial ERP -->
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <div>
      <h2 class="h5 fw-bold mb-0" style="color:var(--text);">
        <i class="bi bi-buildings-fill text-primary me-1"></i>Almacenes / Sucursales
      </h2>
      <p class="text-muted small mb-0">Gestión de almacenes, bodegas y ubicaciones físicas del inventario</p>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-sm btn-outline-secondary" onclick="window.cargarAlmacenesConfig()" title="Actualizar">
        <i class="bi bi-arrow-clockwise"></i>
      </button>
      <button class="btn btn-sm btn-primary" onclick="window.abrirModalAlmacenConfig()">
        <i class="bi bi-plus-lg"></i> <span class="d-none d-md-inline">Nuevo Almacén</span>
      </button>
    </div>
  </div>

  <!-- Búsqueda -->
  <div class="d-flex gap-2 mb-3">
    <div class="input-group input-group-sm" style="max-width:300px;">
      <span class="input-group-text border-0 bg-transparent"><i class="bi bi-search text-muted"></i></span>
      <input type="text" id="alm-buscar" class="form-control border-0 bg-transparent shadow-none" placeholder="Buscar almacén…" oninput="window.filtrarAlmacenesConfig()">
    </div>
    <span id="alm-contador" class="text-muted small ms-auto align-self-center"></span>
  </div>

  <!-- Tabla -->
  <div class="flex-grow-1" style="overflow-y:auto;min-height:0;">
    <div class="card p-0 border-0 shadow-2xs rounded-4 bg-white overflow-hidden" style="border:1px solid #e2e8f0!important;">
      <table class="table table-hover align-middle m-0" id="tabla-almacenes-config" style="font-size:0.86rem;">
        <thead class="bg-light">
          <tr>
            <th class="ps-3 py-2.5 text-uppercase small fw-bold text-secondary">Nombre del Almacén</th>
            <th class="py-2.5 text-uppercase small fw-bold text-secondary">Descripción</th>
            <th class="py-2.5 text-uppercase small fw-bold text-secondary" style="width:120px;">Tipo</th>
            <th class="py-2.5 text-uppercase small fw-bold text-secondary text-center" style="width:100px;">Estado</th>
            <th class="pe-3 py-2.5 text-end text-uppercase small fw-bold text-secondary" style="width:120px;">Acciones</th>
          </tr>
        </thead>
        <tbody id="cuerpo-tabla-almacenes">
          <tr><td colspan="5" class="text-center py-4"><div class="spinner-border spinner-border-sm me-2"></div>Cargando almacenes…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal Nuevo / Editar Almacén -->
<div class="modal fade" id="modal-almacen-config" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4 border-0 shadow-lg">
      <div class="modal-header border-bottom">
        <h5 class="modal-title fw-bold text-dark" id="modal-alm-titulo"><i class="bi bi-building me-1 text-primary"></i>Nuevo Almacén</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="form-almacen-config" onsubmit="window.guardarAlmacenConfig(event)">
        <input type="hidden" id="alm-edit-id">
        <div class="modal-body p-4">
          <div class="row g-3">
            <div class="col-12">
              <label class="fw-bold small text-secondary mb-1">Nombre del Almacén <span class="text-danger">*</span></label>
              <input type="text" class="form-control rounded-3 border bg-light py-2" id="alm-f-nombre" required placeholder="Ej: Principal, Lubricantes, Neumáticos, Taller 1" maxlength="100">
              <small id="alm-f-nombre-help" class="text-muted" style="font-size:0.75rem;"></small>
            </div>
            <div class="col-12">
              <label class="fw-bold small text-secondary mb-1">Descripción</label>
              <input type="text" class="form-control rounded-3 border bg-light py-2" id="alm-f-descripcion" placeholder="Ubicación o detalles del almacén">
            </div>
            <div class="col-12">
              <label class="fw-bold small text-secondary mb-1">Estado</label>
              <select class="form-select rounded-3 border bg-light py-2" id="alm-f-activo">
                <option value="1">Activo</option>
                <option value="0">Inactivo</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer border-top bg-light p-3">
          <button type="button" class="btn btn-light rounded-3 px-3 fw-semibold" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary rounded-3 px-4 fw-bold shadow-sm" id="btn-alm-guardar"><i class="bi bi-save me-1"></i>Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>
