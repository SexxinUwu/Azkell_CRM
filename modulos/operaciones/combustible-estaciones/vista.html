<div class="ep-container" id="modulo-estaciones-proveedores">

    <!-- ── CABECERA ─────────────────────────────────────────────── -->
    <div class="d-flex justify-content-between align-items-center mb-1">
        <div>
            <h4 class="ep-header-title">
                Estaciones de proveedores
                <span class="ep-header-sub">Configuración</span>
            </h4>
        </div>
        <div class="d-flex align-items-center gap-2">
            <button type="button" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1" style="font-size:0.78rem; height:32px; border-radius:6px;" onclick="window.epSincronizarRemoto()" title="Sincronizar proveedores y estaciones con la base de datos">
                <i class="bi bi-arrow-repeat"></i> Sincronizar
            </button>
            <button type="button" class="ep-btn-nuevo" onclick="window.epAbrirModalNuevo()">
                <i class="bi bi-plus-lg"></i> + Nuevo
            </button>
        </div>
    </div>

    <!-- ── TOOLBAR BARRA NARANJA ────────────────────────────────── -->
    <div class="ep-toolbar-card">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
            <!-- Botones de Acción Izquierda -->
            <div class="d-flex align-items-center gap-1">
                <button type="button" class="ep-btn-tool" onclick="window.epImprimir()">
                    <i class="bi bi-printer"></i> Imprimir
                </button>
                <button type="button" class="ep-btn-tool" onclick="window.epExportarExcel()">
                    <i class="bi bi-file-earmark-excel"></i> Excel
                </button>
                <button type="button" class="ep-btn-tool" onclick="window.epAlternarColumnas()">
                    Mostrar Columnas
                </button>
            </div>

            <!-- Buscador Derecha -->
            <div class="d-flex align-items-center gap-2">
                <label for="ep-txt-buscar" style="font-size:0.75rem; color:#475569; font-weight:600; margin:0;">Buscar en tabla:</label>
                <input type="text" id="ep-txt-buscar" class="ep-search-input" placeholder="" oninput="window.epOnBuscarDebounced()">
            </div>
        </div>
    </div>

    <!-- ── TABLA PRINCIPAL ──────────────────────────────────────── -->
    <div class="ep-table-wrap">
        <table class="ep-table" id="ep-tabla-principal">
            <thead>
                <tr>
                    <th style="width: 110px;">Acción</th>
                    <th style="width: 350px;">
                        <i class="bi bi-building me-1 text-secondary"></i> PROVEEDOR
                    </th>
                    <th>
                        <i class="bi bi-geo-alt me-1 text-secondary"></i> NOMBRE
                    </th>
                </tr>
            </thead>
            <tbody id="ep-tbody">
                <tr>
                    <td colspan="3" class="text-center py-5 text-muted">
                        <div class="spinner-border spinner-border-sm text-warning me-2"></div>
                        Cargando estaciones de proveedores...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- ── PIE DE TABLA / PAGINACIÓN ────────────────────────────── -->
    <div class="ep-footer-bar">
        <div id="ep-lbl-contador">Mostrando 0 a 0 de 0 registros</div>
        <div class="d-flex align-items-center gap-1">
            <button type="button" class="btn btn-sm btn-outline-secondary" id="ep-btn-prev" onclick="window.epCambiarPagina(-1)" style="font-size:0.75rem; padding:2px 8px;">
                <i class="bi bi-chevron-left"></i> Anterior
            </button>
            <span id="ep-lbl-pagina" class="mx-2 fw-semibold" style="font-size:0.78rem;">Página 1</span>
            <button type="button" class="btn btn-sm btn-outline-secondary" id="ep-btn-next" onclick="window.epCambiarPagina(1)" style="font-size:0.75rem; padding:2px 8px;">
                Siguiente <i class="bi bi-chevron-right"></i>
            </button>
        </div>
    </div>

</div>

<!-- ============================================================ -->
<!-- Modal Nueva / Editar Estación                                -->
<!-- ============================================================ -->
<div class="modal fade" id="epModalEstacion" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog ep-modal-dialog">
        <div class="modal-content ep-modal-content">
            <div class="ep-modal-header">
                <h5 class="ep-modal-title" id="ep-modal-titulo">Nueva estación</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" style="font-size:0.75rem;"></button>
            </div>
            <div class="ep-modal-body">
                <form id="ep-form-estacion" onsubmit="window.epGuardarEstacion(event)">
                    <input type="hidden" id="ep-form-id" value="">

                    <!-- Proveedor -->
                    <div class="mb-3">
                        <label class="ep-form-label" for="ep-form-proveedor">Proveedor</label>
                        <input type="text" id="ep-form-proveedor" class="ep-form-control text-uppercase" placeholder="Seleccione o escriba proveedor..." list="ep-datalist-proveedores" required>
                        <datalist id="ep-datalist-proveedores"></datalist>
                    </div>

                    <!-- RUC (Opcional) -->
                    <div class="mb-3">
                        <label class="ep-form-label" for="ep-form-ruc">RUC del Proveedor (Opcional)</label>
                        <input type="text" id="ep-form-ruc" class="ep-form-control" placeholder="Ej: 20600066651" maxlength="20">
                    </div>

                    <!-- Nombre de la Estación / Estaciones -->
                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="ep-form-label mb-0">Nombre</label>
                        </div>
                        
                        <div id="ep-estaciones-inputs-container">
                            <div class="d-flex gap-2 mb-2 ep-station-row">
                                <input type="text" class="ep-form-control text-uppercase ep-station-input" placeholder="Nombre de estación (ej: BASE, NAZCA, CHALHUANCA)" required>
                            </div>
                        </div>

                        <!-- Botón Agregar Estación (Idéntico a la imagen) -->
                        <button type="button" class="ep-btn-add-station mt-2" onclick="window.epAgregarFilaEstacion()">
                            <i class="bi bi-plus-circle-fill"></i> Agregar estación
                        </button>
                    </div>

                    <!-- Botones de Acción en el pie del modal -->
                    <div class="ep-modal-footer px-0 pb-0 pt-3">
                        <button type="button" class="ep-btn-cerrar" data-bs-dismiss="modal">Cerrar</button>
                        <button type="submit" class="ep-btn-guardar" id="ep-btn-submit">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
