<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aprobación de Orden de Compra | Azkell ERP</title>
  <link rel="icon" type="image/png" href="/favicon-2003.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --green: #10b981;
      --green-dark: #059669;
      --green-light: #ecfdf5;
      --red: #ef4444;
      --red-dark: #dc2626;
      --red-light: #fef2f2;
    }
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-image: radial-gradient(circle at 50% 0%, #e0f2fe 0%, transparent 65%);
    }
    .wrapper {
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 4px 8px 4px;
    }
    .logo-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.5px;
    }
    .logo-badge img {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.2);
    }
    .badge-pill {
      background: #e2e8f0;
      color: #334155;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .badge-status {
      background: #fef3c7;
      color: #b45309;
      border: 1px solid #fde68a;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    .supplier {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: #f8fafc;
      border: 1px solid #edf2f7;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 16px;
    }
    .meta-item { display: flex; flex-direction: column; }
    .meta-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.3px; }
    .meta-val { font-size: 13px; font-weight: 700; color: var(--text-main); margin-top: 2px; }

    .total-container {
      background: linear-gradient(135deg, #eff6ff 0%, #ecfdf5 100%);
      border: 1px solid #bfdbfe;
      border-radius: 16px;
      padding: 18px 14px;
      margin: 16px 0;
      text-align: center;
    }
    .total-label { 
      font-size: 11px; 
      text-transform: uppercase; 
      color: var(--text-muted); 
      letter-spacing: 0.6px; 
      font-weight: 700; 
    }
    .total-amount { 
      font-size: 32px; 
      font-weight: 800; 
      color: var(--accent); 
      margin-top: 4px; 
      letter-spacing: -0.5px; 
    }

    .pdf-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: #eff6ff;
      color: var(--accent);
      border: 1px solid #bfdbfe;
      border-radius: 14px;
      padding: 14px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 16px;
      transition: all 0.2s;
    }
    .pdf-button:hover {
      background: #dbeafe;
    }
    .pdf-button:active {
      transform: scale(0.98);
    }

    .table-container { margin: 16px 0 8px 0; }
    .table-header-title { 
      font-size: 12px; 
      font-weight: 700; 
      text-transform: uppercase; 
      color: var(--text-muted); 
      margin-bottom: 10px; 
      letter-spacing: 0.5px; 
    }
    .item-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item-desc { font-size: 13px; font-weight: 700; color: var(--text-main); line-height: 1.3; }
    .item-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; font-weight: 500; }
    .item-total { font-size: 14px; font-weight: 800; color: var(--text-main); text-align: right; }

    .actions {
      display: flex;
      gap: 12px;
      padding-top: 10px;
      position: sticky;
      bottom: 0;
      background: linear-gradient(0deg, var(--bg) 85%, transparent 100%);
      padding-bottom: 12px;
    }
    .btn {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-approve {
      background: var(--green);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }
    .btn-approve:hover {
      background: var(--green-dark);
    }
    .btn-reject {
      background: var(--red-light);
      color: var(--red-dark);
      border: 1px solid #fecaca;
    }
    .btn-reject:hover {
      background: #fee2e2;
    }

    /* Modal de confirmación de rechazo */
    #rejectModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 20px;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-box {
      background: #ffffff;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }
    textarea {
      width: 100%;
      height: 100px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      color: var(--text-main);
      padding: 12px;
      margin: 14px 0;
      outline: none;
      font-size: 14px;
      resize: none;
    }
    textarea:focus { 
      border-color: var(--accent); 
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    
    .status-screen {
      text-align: center;
      margin: auto;
      padding: 40px 20px;
      background: #ffffff;
      border: 1px solid var(--card-border);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    .status-icon {
      font-size: 58px;
      margin-bottom: 14px;
      display: inline-block;
    }
    .status-title { font-size: 20px; font-weight: 800; color: var(--text-main); margin-bottom: 8px; }
    .status-desc { font-size: 14px; color: var(--text-sub); line-height: 1.5; }
  </style>
</head>
<body>

  <div class="wrapper" id="mainContainer">
    <div class="top-bar">
      <div class="logo-badge">
        <img src="/favicon-2003.png" alt="Azkell">
        <span id="tenantBrandTitle">AZKELL ERP</span>
      </div>
      <span class="badge-pill" id="badgeStatus">⏱ Vigente 24h</span>
    </div>

    <div class="card" id="cardContent">
      <div class="header">
        <span class="badge-status">
          ⏳ Pendiente de Aprobación
        </span>
        <span id="ocDate" style="font-size: 12px; color: var(--text-muted); font-weight: 600;"></span>
      </div>

      <h1 class="title" id="ocCode">Cargando...</h1>
      <p class="supplier" id="ocSupplier">--</p>

      <div class="meta-grid">
        <div class="meta-item">
          <span class="meta-label">Solicitado por</span>
          <span class="meta-val" id="ocSolicitante">--</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">RUC Proveedor</span>
          <span class="meta-val" id="ocRuc">--</span>
        </div>
      </div>

      <div class="total-container">
        <div class="total-label">Monto Total a Autorizar</div>
        <div class="total-amount" id="ocTotal">--</div>
      </div>

      <!-- Sustento de Cotización / Archivo Adjunto -->
      <a id="btnQuotation" href="#" target="_blank" class="pdf-button" style="display: none;">
        📄 Ver Sustento / Cotización Adjunta
      </a>

      <div class="table-container">
        <div class="table-header-title">Ítems Solicitados</div>
        <div id="itemsList">
          <div style="text-align: center; color: var(--text-muted); padding: 16px; font-size: 13px;">Cargando ítems...</div>
        </div>
      </div>
    </div>

    <div class="actions" id="actionButtons">
      <button class="btn btn-reject" onclick="openRejectModal()">✕ Rechazar</button>
      <button class="btn btn-approve" onclick="submitDecision('APPROVE')">✓ Aprobar Orden</button>
    </div>
  </div>

  <!-- Modal para Motivo de Rechazo -->
  <div id="rejectModal">
    <div class="modal-box">
      <h3 style="font-size: 17px; font-weight: 800; color: var(--text-main);">Rechazar Orden de Compra</h3>
      <p style="font-size: 13px; color: var(--text-sub); margin-top: 4px;">Indica el motivo de la observación para el solicitante:</p>
      <textarea id="rejectReason" placeholder="Ej: Precios unitarios muy altos o requiere cotizar con otro proveedor..."></textarea>
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-reject" style="padding: 12px; font-size: 13px;" onclick="closeRejectModal()">Cancelar</button>
        <button class="btn" style="background: var(--red); color: white; padding: 12px; font-size: 13px;" onclick="submitDecision('REJECT')">Confirmar Rechazo</button>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('t');

    async function loadData() {
      if (!token) {
        showErrorScreen('Token no proporcionado', 'Acceso denegado. Este enlace requiere un token de seguridad válido.');
        return;
      }

      try {
        const res = await fetch(`/api/approvals/oc?t=${token}`);
        const data = await res.json();

        if (!res.ok) {
          showErrorScreen(data.error || 'Enlace no válido', 'Este enlace no existe o ya fue consumido.');
          return;
        }

        if (data.is_expired) {
          showErrorScreen('Enlace Expirado', 'Este enlace de aprobación tenía una vigencia de 24 horas y ha caducado.');
          return;
        }

        if (data.is_used) {
          showStatusScreen(
            data.token_estado === 'APROBADO' ? '✅' : '❌',
            `Orden ${data.token_estado === 'APROBADO' ? 'Aprobada' : 'Rechazada'}`,
            `Esta orden de compra ya fue procesada anteriormente con estado: <b>${data.token_estado}</b>.`
          );
          return;
        }

        // Renderizar datos de la OC
        document.getElementById('ocCode').innerText = data.codigo;
        document.getElementById('ocSupplier').innerText = data.proveedor_nombre;
        document.getElementById('ocRuc').innerText = data.proveedor_ruc || 'No registrado';
        document.getElementById('ocSolicitante').innerText = data.solicitado_por || 'Taller / Compras';

        const dateStr = data.creado_en ? new Date(data.creado_en).toLocaleDateString('es-PE', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
        document.getElementById('ocDate').innerText = dateStr;

        const sym = data.moneda === 'USD' ? '$' : 'S/';
        document.getElementById('ocTotal').innerText = `${sym} ${parseFloat(data.monto_total || 0).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

        if (data.sustento_cotizacion_url) {
          const btn = document.getElementById('btnQuotation');
          btn.href = data.sustento_cotizacion_url;
          btn.style.display = 'flex';
        }

        // Renderizar ítems
        const itemsList = document.getElementById('itemsList');
        if (data.items && data.items.length > 0) {
          itemsList.innerHTML = data.items.map(item => `
            <div class="item-card">
              <div>
                <div class="item-desc">${escapeHtml(item.descripcion)}</div>
                <div class="item-sub">${item.cantidad} ${item.unidad_medida || 'UND'} &times; ${sym} ${parseFloat(item.precio_unitario || 0).toFixed(2)}</div>
              </div>
              <div class="item-total">${sym} ${parseFloat(item.subtotal || 0).toFixed(2)}</div>
            </div>
          `).join('');
        } else {
          itemsList.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 12px; font-size: 13px;">Sin desglose de ítems</div>`;
        }

      } catch (err) {
        showErrorScreen('Error de conexión', err.message);
      }
    }

    async function submitDecision(action) {
      const reason = document.getElementById('rejectReason').value.trim();
      if (action === 'REJECT' && !reason) {
        alert('Por favor escribe un motivo de rechazo.');
        return;
      }

      // Desactivar botones mientras procesa
      const actionBtns = document.getElementById('actionButtons');
      if (actionBtns) actionBtns.style.opacity = '0.5';

      try {
        const res = await fetch('/api/approvals/oc/action', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, action, reason })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error procesando solicitud');

        closeRejectModal();
        showStatusScreen(
          action === 'APPROVE' ? '✅' : '❌',
          action === 'APPROVE' ? 'Orden Aprobada con Éxito' : 'Orden Rechazada',
          action === 'APPROVE' 
            ? 'La Orden de Compra ha sido autorizada satisfactoriamente y el ERP ha sido actualizado.'
            : 'Se ha registrado la observación y el estado fue cambiado a RECHAZADA en el ERP.'
        );

      } catch (err) {
        alert(err.message);
        if (actionBtns) actionBtns.style.opacity = '1';
      }
    }

    function showStatusScreen(icon, title, desc) {
      document.getElementById('mainContainer').innerHTML = `
        <div class="status-screen">
          <div class="status-icon">${icon}</div>
          <h2 class="status-title">${title}</h2>
          <p class="status-desc">${desc}</p>
        </div>
      `;
    }

    function showErrorScreen(title, desc) {
      document.getElementById('mainContainer').innerHTML = `
        <div class="status-screen">
          <div class="status-icon">⚠️</div>
          <h2 class="status-title">${title}</h2>
          <p class="status-desc">${desc}</p>
        </div>
      `;
    }

    function openRejectModal() { document.getElementById('rejectModal').style.display = 'flex'; }
    function closeRejectModal() { document.getElementById('rejectModal').style.display = 'none'; }
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text || '';
      return div.innerHTML;
    }

    loadData();
  </script>
</body>
</html>
