<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aprobación de Orden de Compra | Azkell ERP</title>
  <link rel="icon" type="image/png" href="/favicon-2003.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.2);
      --green: #10b981;
      --green-glow: rgba(16, 185, 129, 0.2);
      --red: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-image: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.12) 0%, transparent 70%);
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding: 0 4px;
    }
    .logo-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #93c5fd;
      letter-spacing: 0.5px;
    }
    .logo-badge img {
      width: 24px;
      height: 24px;
      border-radius: 6px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .badge {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    .supplier {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .meta-item { display: flex; flex-direction: column; }
    .meta-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
    .meta-val { font-size: 13px; font-weight: 600; color: var(--text); margin-top: 2px; }

    .total-container {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.15) 0%, rgba(16, 185, 129, 0.1) 100%);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 16px;
      padding: 16px;
      margin: 16px 0;
      text-align: center;
    }
    .total-label { font-size: 11px; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.5px; font-weight: 600; }
    .total-amount { font-size: 32px; font-weight: 800; color: #38bdf8; margin-top: 4px; letter-spacing: -0.5px; }

    .pdf-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 14px;
      padding: 14px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 16px;
      transition: all 0.2s;
    }
    .pdf-button:active {
      transform: scale(0.98);
      background: rgba(56, 189, 248, 0.15);
    }

    .table-container { margin: 16px 0 8px 0; }
    .table-header-title { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; letter-spacing: 0.5px; }
    .item-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item-desc { font-size: 14px; font-weight: 600; line-height: 1.3; }
    .item-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .item-total { font-size: 14px; font-weight: 700; color: #f1f5f9; text-align: right; }

    .actions {
      display: flex;
      gap: 12px;
      padding-top: 12px;
      position: sticky;
      bottom: 0;
      background: linear-gradient(0deg, var(--bg) 80%, transparent 100%);
      padding-bottom: 8px;
    }
    .btn {
      flex: 1;
      padding: 18px;
      border: none;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-approve {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      box-shadow: 0 4px 20px var(--green-glow);
    }
    .btn-reject {
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    /* Modal de confirmación de rechazo */
    #rejectModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 20px;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-box {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 22px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    textarea {
      width: 100%;
      height: 100px;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      padding: 12px;
      margin: 14px 0;
      outline: none;
      font-size: 14px;
      resize: none;
    }
    textarea:focus { border-color: var(--accent); }
    
    .status-screen {
      text-align: center;
      margin: auto;
      padding: 40px 20px;
    }
    .status-icon {
      font-size: 64px;
      margin-bottom: 16px;
      display: inline-block;
    }
    .status-title { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    .status-desc { font-size: 14px; color: var(--text-muted); line-height: 1.5; }
  </style>
</head>
<body>

  <div id="mainContainer">
    <div class="top-bar">
      <div class="logo-badge">
        <img src="/favicon-2003.png" alt="Azkell">
        <span>AZKELL ERP</span>
      </div>
      <span class="badge" id="badgeStatus">VIGENTE 24H</span>
    </div>

    <div class="card" id="cardContent">
      <div class="header">
        <span class="badge" style="background: rgba(245, 158, 11, 0.15); color: #fbbf24; border-color: rgba(245, 158, 11, 0.3);">
          Pendiente de Aprobación
        </span>
        <span id="ocDate" style="font-size: 12px; color: var(--text-muted); font-weight: 600;"></span>
      </div>

      <h1 class="title" id="ocCode">Cargando...</h1>
      <p class="supplier" id="ocSupplier">--</p>

      <div class="meta-grid">
        <div class="meta-item">
          <span class="meta-label">Solicitado por</span>
          <span class="meta-val" id="ocSolicitante">--</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">RUC Proveedor</span>
          <span class="meta-val" id="ocRuc">--</span>
        </div>
      </div>

      <div class="total-container">
        <div class="total-label">Monto Total a Autorizar</div>
        <div class="total-amount" id="ocTotal">--</div>
      </div>

      <!-- Sustento de Cotización / Archivo Adjunto -->
      <a id="btnQuotation" href="#" target="_blank" class="pdf-button" style="display: none;">
        📄 Ver Sustento / Cotización (PDF)
      </a>

      <div class="table-container">
        <div class="table-header-title">Ítems Solicitados</div>
        <div id="itemsList">
          <div style="text-align: center; color: var(--text-muted); padding: 20px;">Cargando ítems...</div>
        </div>
      </div>
    </div>

    <div class="actions" id="actionButtons">
      <button class="btn btn-reject" onclick="openRejectModal()">Rechazar</button>
      <button class="btn btn-approve" onclick="submitDecision('APPROVE')">✓ Aprobar OC</button>
    </div>
  </div>

  <!-- Modal para Motivo de Rechazo -->
  <div id="rejectModal">
    <div class="modal-box">
      <h3 style="font-size: 18px; font-weight: 700;">Rechazar Orden de Compra</h3>
      <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Indica el motivo o la observación para el equipo:</p>
      <textarea id="rejectReason" placeholder="Ej. Precios unitarios muy altos o requiere cotizar con otro proveedor..."></textarea>
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-reject" style="padding: 12px;" onclick="closeRejectModal()">Cancelar</button>
        <button class="btn" style="background: var(--red); color: white; padding: 12px;" onclick="submitDecision('REJECT')">Confirmar</button>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('t');

    async function loadData() {
      if (!token) {
        showErrorScreen('Token no proporcionado', 'Acceso denegado. Este enlace requiere un token seguro.');
        return;
      }

      try {
        const res = await fetch(`/api/approvals/oc?t=${token}`);
        const data = await res.json();

        if (!res.ok) {
          showErrorScreen(data.error || 'Enlace no válido', 'Este enlace no existe o ya no se encuentra disponible.');
          return;
        }

        if (data.is_expired) {
          showErrorScreen('Enlace Expirado', 'Este enlace de aprobación tenía una vigencia de 24 horas y ha expirado.');
          return;
        }

        if (data.is_used) {
          showStatusScreen(
            data.token_estado === 'APROBADO' ? '✅' : '❌',
            `Orden ${data.token_estado === 'APROBADO' ? 'Aprobada' : 'Rechazada'}`,
            `Esta orden de compra ya fue procesada anteriormente.`
          );
          return;
        }

        // Renderizar datos de la OC
        document.getElementById('ocCode').innerText = data.codigo;
        document.getElementById('ocSupplier').innerText = data.proveedor_nombre;
        document.getElementById('ocRuc').innerText = data.proveedor_ruc || 'No registrado';
        document.getElementById('ocSolicitante').innerText = data.solicitado_por || 'Taller / Compras';

        const dateStr = data.creado_en ? new Date(data.creado_en).toLocaleDateString('es-PE', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
        document.getElementById('ocDate').innerText = dateStr;

        const sym = data.moneda === 'USD' ? '$' : 'S/';
        document.getElementById('ocTotal').innerText = `${sym} ${parseFloat(data.monto_total || 0).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

        if (data.sustento_cotizacion_url) {
          const btn = document.getElementById('btnQuotation');
          btn.href = data.sustento_cotizacion_url;
          btn.style.display = 'flex';
        }

        // Renderizar ítems
        const itemsList = document.getElementById('itemsList');
        if (data.items && data.items.length > 0) {
          itemsList.innerHTML = data.items.map(item => `
            <div class="item-card">
              <div>
                <div class="item-desc">${escapeHtml(item.descripcion)}</div>
                <div class="item-sub">${item.cantidad} ${item.unidad_medida || 'UND'} &times; ${sym} ${parseFloat(item.precio_unitario || 0).toFixed(2)}</div>
              </div>
              <div class="item-total">${sym} ${parseFloat(item.subtotal || 0).toFixed(2)}</div>
            </div>
          `).join('');
        } else {
          itemsList.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 12px;">Sin desglose de ítems</div>`;
        }

      } catch (err) {
        showErrorScreen('Error de conexión', err.message);
      }
    }

    async function submitDecision(action) {
      const reason = document.getElementById('rejectReason').value.trim();
      if (action === 'REJECT' && !reason) {
        alert('Por favor escribe un motivo de rechazo.');
        return;
      }

      // Desactivar botones mientras procesa
      const actionBtns = document.getElementById('actionButtons');
      if (actionBtns) actionBtns.style.opacity = '0.5';

      try {
        const res = await fetch('/api/approvals/oc/action', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, action, reason })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error procesando solicitud');

        closeRejectModal();
        showStatusScreen(
          action === 'APPROVE' ? '✅' : '❌',
          action === 'APPROVE' ? 'Orden Aprobada con Éxito' : 'Orden Rechazada',
          action === 'APPROVE' 
            ? 'La Orden de Compra ha sido autorizada y el ERP se ha actualizado.'
            : 'Se ha registrado la observación y el estado fue cambiado a RECHAZADA.'
        );

      } catch (err) {
        alert(err.message);
        if (actionBtns) actionBtns.style.opacity = '1';
      }
    }

    function showStatusScreen(icon, title, desc) {
      document.getElementById('mainContainer').innerHTML = `
        <div class="status-screen">
          <div class="status-icon">${icon}</div>
          <h2 class="status-title">${title}</h2>
          <p class="status-desc">${desc}</p>
        </div>
      `;
    }

    function showErrorScreen(title, desc) {
      document.getElementById('mainContainer').innerHTML = `
        <div class="status-screen">
          <div class="status-icon">⚠️</div>
          <h2 class="status-title">${title}</h2>
          <p class="status-desc">${desc}</p>
        </div>
      `;
    }

    function openRejectModal() { document.getElementById('rejectModal').style.display = 'flex'; }
    function closeRejectModal() { document.getElementById('rejectModal').style.display = 'none'; }
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text || '';
      return div.innerHTML;
    }

    loadData();
  </script>
</body>
</html>
