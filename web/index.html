<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azkell Fleet</title>
    <style>
        body {
            margin: 0;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: system-ui, sans-serif;
            color: #fff;
        }
        .loader { text-align: center; }
        .loader p { margin-top: 16px; font-size: 14px; opacity: 0.7; }
    </style>
</head>
<body>
    <div class="loader">
        <p>Cargando Azkell Fleet...</p>
    </div>
    <script>
        // Si detecta Smart TV o pantalla grande sin touch, abre directo el War Room TV
        var isTV = /TV|SmartTV|Android TV|GoogleTV|AppleTV|HbbTV|CrKey|LargeScreen/i.test(navigator.userAgent) || (window.innerWidth >= 1920 && !('ontouchstart' in window));
        var targetUrl = isTV ? 'https://azkell-crm.onrender.com/tv' : 'https://azkell-crm.onrender.com';
        window.location.href = targetUrl;
    </script>
</body>
</html>
