<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinculando Wialon — Azkell Fleet ERP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 32px 28px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(56, 189, 248, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        .success-icon {
            display: none;
            width: 54px;
            height: 54px;
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border-radius: 50%;
            font-size: 32px;
            line-height: 54px;
            margin: 0 auto 16px;
        }
        h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
        p { font-size: 0.875rem; color: #94a3b8; line-height: 1.5; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <div id="spinner" class="spinner"></div>
        <div id="success-icon" class="success-icon">✓</div>
        <h2 id="title">Conectando con Wialon...</h2>
        <p id="msg">Capturando credenciales y autenticando con el ERP.</p>
    </div>

    <script>
        (function() {
            // Wialon devuelve el access_token en el hash (#access_token=...&user_name=...) o query params
            var hash = window.location.hash.substring(1);
            var search = window.location.search.substring(1);
            var params = new URLSearchParams(hash || search);

            var token = params.get('access_token');
            var user = params.get('user_name') || '';

            if (token) {
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('success-icon').style.display = 'block';
                document.getElementById('title').textContent = '¡Wialon Conectado!';
                document.getElementById('msg').textContent = 'Token generado con éxito para ' + (user || 'usuario') + '. Cerrando ventana...';

                if (window.opener && !window.opener.closed) {
                    window.opener.postMessage({
                        type: 'WIALON_AUTH_SUCCESS',
                        token: token,
                        user: user
                    }, '*');
                }

                setTimeout(function() {
                    window.close();
                }, 1200);
            } else {
                document.getElementById('title').textContent = 'Esperando autorización...';
                document.getElementById('msg').textContent = 'No se detectó un token en la respuesta. Si cerraste la sesión, vuelve a intentar.';
            }
        })();
    </script>
</body>
</html>
