version: '3.8'

services:
  evolution-api:
    image: atendai/evolution-api:v2.1.2
    container_name: azkell_evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8080
      # Misma clave que EVOLUTION_API_KEY del .env (docker compose lee el .env de esta carpeta)
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:?Falta EVOLUTION_API_KEY en .env}
      # Base de datos interna SQLite para guardar tokens de sesión de WhatsApp persistentes
      - DATABASE_ENABLED=true
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_local
      - DATABASE_PROVIDER=local
      - CACHE_REDIS_ENABLED=false
      - DEL_INSTANCE=false
      - LOG_LEVEL=ERROR,WARN,INFO
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_instances:
    driver: local
