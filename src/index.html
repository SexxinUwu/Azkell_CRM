<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/api/tenant-logo" />
    <link rel="apple-touch-icon" href="/api/tenant-logo" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="description" content="Azkell Fleet — gestión de flotas" />
    <title>Azkell Fleet</title>
    <script>
      // Si el archivo principal de la app no carga (se publicó una versión nueva y esta página es vieja), se recarga
      // una sola vez para tomar la versión actual. Sin este paso la pantalla queda en blanco hasta mover la dirección.
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (!t || t.tagName !== 'SCRIPT') return;
        var ultima = Number(sessionStorage.getItem('fleet_recarga_script') || 0);
        if (Date.now() - ultima < 30000) return;
        sessionStorage.setItem('fleet_recarga_script', String(Date.now()));
        window.location.reload();
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
